---
# Note:
# The project was renamed from "Gutenberg" to "Papers"
# See https://phabricator.wikimedia.org/T439226
BASIC:
  id: kiwix-gutenberg
  label: Papers scraper
  description: "{{Special:MyLanguage/Translations:Group descriptions/kiwix/en}}"
  namespace: NS_KIWIX
  class: FileBasedMessageGroup
  support:
    url: https://github.com/openzim/papers/issues/new
    params:
      title: Translation issue with message %MESSAGE%
      body: "\n\nURL: %MESSAGE_URL%"

FILES:
  format: Json
  sourcePattern: "%GROUPROOT%/kiwix-papers/locales/%CODE%.json"
  nestingSeparator: .

MANGLER:
  class: StringMatcher
  prefix: kiwix-gutenberg-
  patterns:
    - "*"

VALIDATORS:
  - id: InsertableRegex
    enforce: true
    insertable: true
    params: /\{[a-zA-Z0-9_]+\}/
