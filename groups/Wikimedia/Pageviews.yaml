BASIC:
  id: pageviews
  label: Pageviews Analysis
  icon: wiki://Pageviews Analysis.svg
  description: "{{Special:MyLanguage/Translations:Group descriptions/pageviews/en}}"
  class: FileBasedMessageGroup
  namespace: NS_WIKIMEDIA

MANGLER:
  class: StringMatcher
  prefix: pageviews-
  patterns:
    - "*"

FILES:
  format: Json
  sourcePattern: "%GROUPROOT%/pageviews/i18n/%CODE%.json"

TAGS:
  optional:
    - pageviews-csv
    - pageviews-json
    - pageviews-png
    - pageviews-comma-separator
    - pageviews-wikibooks
    - pageviews-wikinews
    - pageviews-wikipedia
    - pageviews-wikisource
    - pageviews-wikiversity
    - pageviews-wikivoyage
    - pageviews-wiktionary

VALIDATORS:
  - id: BraceBalance
  - id: MediaWikiParameter
  - id: MediaWikiPlural

INSERTABLES:
  - class: MediaWikiInsertablesSuggester
