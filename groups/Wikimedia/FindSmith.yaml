---
BASIC:
  id: findsmith
  label: FindSmith
  description: "{{Special:MyLanguage/Translations:Group descriptions/findsmith/en}}"
  namespace: NS_WIKIMEDIA
  class: FileBasedMessageGroup
  support:
    url: https://phabricator.wikimedia.org/maniphest/task/edit/form/1/
    params:
      projects: Tool-findsmith
      title: Translation issue about message %MESSAGE%
      description: "\n\n----\n\nMessage URL: %MESSAGE_URL%"

MANGLER:
  class: StringMatcher
  prefix: findsmith-
  patterns:
    - "*"

FILES:
  format: Json
  sourcePattern: "%GROUPROOT%/findsmith/i18n/%CODE%.json"

VALIDATORS:
  - id: MediaWikiParameter
    insertable: true
    enforce: true
  - id: MediaWikiPlural
    enforce: true
  - id: BraceBalance
    enforce: true
