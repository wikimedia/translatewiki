TEMPLATE:
  BASIC:
    description: "{{Special:MyLanguage/Translations:Group descriptions/wikilearn/en}}"
    namespace: NS_WIKIMEDIA
    class: FileBasedMessageGroup
    support:
      url: https://github.com/wikimedia/edx-platform/issues/new
      params:
        title: Translation issue with message %MESSAGE%
        body: "\n\nURL: %MESSAGE_URL%"

  FILES:
    # The repository is shared with upstream Open edX, which uses Django/
    # Transifex locale names for the directories that already exist.
    codeMap:
      af: af_ZA
      ary: ar_MA
      es: es_ES
      es-419: es_419
      it: it_IT
      pt: pt_PT
      pt-br: pt_BR
      tr: tr_TR
      zh-hans: zh_CN
      zh-hk: zh_HK

---
BASIC:
  id: wikilearn
  label: WikiLearn
  meta: yes
  class: AggregateMessageGroup

GROUPS:
  - wikilearn-*

---
BASIC:
  id: wikilearn-edx-platform
  label: WikiLearn - edx-platform

VALIDATORS:
  # Variables like %(platform_name)s
  - id: InsertableRegex
    insertable: true
    enforce: true
    params: /%\([a-z0-9_]+\)[sd]/
  # Variables like {username}
  - id: InsertableRegex
    insertable: true
    enforce: true
    params: /\{[a-z0-9_]+\}/
  - id: GettextNewline
    enforce: true
  - id: GettextPlural
    enforce: true
  - id: BraceBalance

INSERTABLES:
  - class: HtmlTagInsertablesSuggester

MANGLER:
  class: StringMatcher
  prefix: wikilearn-edx-platform-
  patterns:
    - "*"

FILES:
  format: Gettext
  header: |
    # This file is part of the WikiLearn Project
    # This file is distributed under the same license as the WikiLearn package.
    #
  sourcePattern: "%GROUPROOT%/wikilearn/translations-custom/edx-platform/conf/locale/%CODE%/LC_MESSAGES/django.po"

