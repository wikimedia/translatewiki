---
BASIC:
  id: copyvios
  label: Earwig's Copyvio Detector
  description: "{{Special:MyLanguage/Translations:Group descriptions/copyvios/en}}"
  namespace: NS_WIKIMEDIA
  class: FileBasedMessageGroup
  support:
    url: https://github.com/earwig/copyvios/issues
    params:
      title: Translation issue with message %MESSAGE%
      body: "\n\nURL: %MESSAGE_URL%"

MANGLER:
  class: StringMatcher
  prefix: copyvios-
  patterns:
    - "*"

FILES:
  format: Json
  sourcePattern: "%GROUPROOT%/copyvios/i18n/%CODE%.json"

VALIDATORS:
  - id: BraceBalance
    enforce: true
  - id: MediaWikiParameter
    insertable: true
    enforce: true
  - id: MediaWikiPlural

INSERTABLES:
  - class: HtmlTagInsertablesSuggester
