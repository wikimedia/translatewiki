---
BASIC:
  id: linkcount
  label: Link Count
  icon: wiki://Link_Count_icon.png
  description: "{{Special:MyLanguage/Translations:Group descriptions/linkcount/en}}"
  namespace: NS_WIKIMEDIA
  class: FileBasedMessageGroup
  support:
    url: https://github.com/BrandonXLF/linkcount/issues/new
    params:
      title: Translation issue with message %MESSAGE%
      body: "\n\nURL: %MESSAGE_URL%"

MANGLER:
  class: StringMatcher
  prefix: linkcount-
  patterns:
    - "*"

FILES:
  format: Json
  sourcePattern: "%GROUPROOT%/linkcount/i18n/%CODE%.json"

VALIDATORS:
  - id: MediaWikiParameter
    insertable: true
    enforce: true
  - id: BraceBalance
