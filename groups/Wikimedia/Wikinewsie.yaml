---
BASIC:
  id: wikinewsie
  label: Wikinewsie
  description: "{{Special:MyLanguage/Translations:Group descriptions/wikinewsie/en}}"
  namespace: NS_WIKIMEDIA
  class: FileBasedMessageGroup
  support:
    url: https://phabricator.wikimedia.org/maniphest/task/edit/form/1/
    params:
      projects: Tool-wikinewsie, i18n
      title: Translation issue about message %MESSAGE%
      description: "\n\n----\n\nMessage URL: %MESSAGE_URL%"

MANGLER:
  class: StringMatcher
  prefix: wikinewsie-
  patterns:
    - "*"

FILES:
  format: Json
  sourcePattern: "%GROUPROOT%/wikinewsie/i18n/%CODE%.json"

VALIDATORS:
  - id: MediaWikiParameter
    insertable: true
    enforce: false
  - id: InsertableRegex
    insertable: true
    enforce: true
    params: /\{[-a-zA-Z0-9_]+\}/
  - id: BraceBalance
