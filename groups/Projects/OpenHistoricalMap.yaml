TEMPLATE:
  BASIC:
    namespace: NS_PROJECTS
    class: FileBasedMessageGroup
  MANGLER:
    class: StringMatcher
    patterns:
      - "*"
  INSERTABLES:
    - class: HtmlTagInsertablesSuggester

---
BASIC:
  id: ohm-all
  label: OpenHistoricalMap
  description: "{{Special:MyLanguage/Translations:Group descriptions/openhistoricalmap/en}}"
  meta: yes
  class: AggregateMessageGroup

GROUPS:
  - ohm-*

---
BASIC:
  id: ohm-website
  label: OpenHistoricalMap Website
  icon: wiki://OpenHistoricalMap_logo.svg
  description: "{{Special:MyLanguage/Translations:Group descriptions/openhistoricalmap/en}}"
  support:
    url: https://github.com/OpenHistoricalMap/issues/issues/new
    params:
      title: Translation issue with message %MESSAGE%
      body: "\n\nURL: %MESSAGE_URL%"

FILES:
  format: Yaml
  parseCLDRPlurals: true
  codeAsRoot: true
  sourcePattern: "%GROUPROOT%/ohm-website/config/locales/overrides/%CODE%.yml"
  codeMap:
    be-tarask: be-Tarask
    en-gb: en-GB
    es-mx: es-MX
    ku-latn: ku-Latn
    pt-br: pt
    pt: pt-PT
    sh-cyrl: sh-Cyrl
    sh-latn: sh
    sr-ec: sr
    sr-el: sr-Latn
    tt-cyrl: tt
    zh-hans: zh-CN
    zh-hant: zh-TW
    zh-hk: zh-HK

MANGLER:
  prefix: ohm-

VALIDATORS:
  - id: InsertableRubyVariable
    enforce: true
    insertable: true
  - id: MatchSet
    enforce: true
    include:
      - html.dir
    params:
      values:
        - ltr
        - rtl
  - id: UnicodePlural
    enforce: true

INSERTABLES:
  # HTML entities
  - class: RegexInsertablesSuggester
    params: '/&#?\w+;/'

TAGS:
  optional:
    - ohm-auth.providers.openstreetmap
    - ohm-changesets.index.feed.cc0
    - ohm-date.formats.brief
    - ohm-date.formats.brief_bce
    - ohm-date.formats.brief_ce
    - ohm-date.formats.range
    - ohm-errors.contact.contact_url
    - ohm-geocoder.search_osm_nominatim.suffix_format
    - ohm-javascripts.map.openhistoricalmap_contributors
    - ohm-javascripts.query.suffix_format
    - ohm-layouts.partners_devseed
    - ohm-layouts.partners_greeninfo
    - ohm-layouts.partners_osmf
    - ohm-layouts.partners_osmus
    - ohm-layouts.project_name.title
    - ohm-printable_name.with_date_html
    - ohm-site.about_section.contribute_1_bluesky
    - ohm-site.about_section.contribute_1_mastodon
    - ohm-site.about_section.contribute_1_wiki_url
    - ohm-site.about_section.contribute_2_osmus
